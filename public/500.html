<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FGS Software — Hệ thống tạm gián đoạn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      text-align: center;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.35);
    }
    h1 { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; line-height: 1.35; }
    p { font-size: 15px; line-height: 1.65; color: #94a3b8; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
    }
    a:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(37, 99, 235, 0.45); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">⚙</div>
    <h1>Hệ thống đang gặp sự cố</h1>
    <p>Máy chủ tạm thời không phản hồi. Vui lòng thử lại sau vài phút hoặc quay về trang chủ.</p>
    <a href="/vi">Về trang chủ</a>
  </div>
</body>
</html>
